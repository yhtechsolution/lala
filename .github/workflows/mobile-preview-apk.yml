name: Mobile preview APK

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mobile-preview-apk.yml'
      - 'mobile/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY || secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN || secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID || secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET || secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_APP_ID || secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Validate public Firebase client values
        run: |
          missing=0
          for name in \
            EXPO_PUBLIC_FIREBASE_API_KEY \
            EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN \
            EXPO_PUBLIC_FIREBASE_PROJECT_ID \
            EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET \
            EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID \
            EXPO_PUBLIC_FIREBASE_APP_ID; do
            if [ -z "${!name//[[:space:]]/}" ] || [[ "${!name}" == your_* ]]; then
              echo "::error title=Missing Firebase configuration::$name must be set as a repository Actions variable or secret."
              missing=1
            fi
          done
          exit "$missing"
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build installable release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: lala-preview-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
